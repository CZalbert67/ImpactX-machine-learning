name: Python ML CI & Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Base CI Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety pytest || true

    - name: Install dependencies
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "No requirements.txt found, skipping dependency install."
        fi

    # DevSecOps: Escaneo de vulnerabilidades en código Python con Bandit
    - name: Security scan with Bandit
      run: |
        bandit -r . -x ./tests -ll || true

    # DevSecOps: Escaneo de vulnerabilidades en dependencias con Safety
    - name: Security scan dependencies with Safety
      run: |
        if [ -f requirements.txt ]; then
          safety check || true
        else
          echo "No requirements.txt found, skipping safety check."
        fi

    # Ejecutar pruebas unitarias si existen
    - name: Run Tests
      run: |
        if [ -d tests ] || ls test_*.py 1> /dev/null 2>&1; then
          pytest
        else
          echo "No tests found, skipping execution."
        fi
