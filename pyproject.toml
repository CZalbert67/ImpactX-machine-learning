[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "impactx-ml"
version = "0.2.0"
description = "Prototipo predictivo de gravedad de choque y decisión de alertas para ImpactX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "httpx>=0.27,<1",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
impactx-train = "impactx_ml.train:main"
impactx-predict = "impactx_ml.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
impactx_ml = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
junit_family = "xunit2"
addopts = "-q"
