[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "impactx-ml"
version = "0.1.0"
description = "ImpactX Machine Learning Component"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
junit_family = "xunit2"
